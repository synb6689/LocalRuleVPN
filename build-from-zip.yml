name: Build LocalRuleVPN from repaired source ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'LocalRuleVPN_repaired_source.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check and extract repaired Android project ZIP
        run: |
          test -f LocalRuleVPN_repaired_source.zip
          mkdir -p android-project
          unzip -q LocalRuleVPN_repaired_source.zip -d android-project
          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle
          test -f android-project/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalRuleVPN-repaired-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
