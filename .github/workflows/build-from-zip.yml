name: Build debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LocalRuleVPN_starter.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check ZIP file
        run: test -f LocalRuleVPN_starter.zip

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q LocalRuleVPN_starter.zip -d android-project
          echo "Checking extracted files:"
          find android-project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        run: |
          if [ -f android-project/settings.gradle ] || [ -f android-project/settings.gradle.kts ]; then
            echo "PROJECT_DIR=android-project" >> "$GITHUB_ENV"
          else
            PROJECT_SETTINGS=$(find android-project -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
            if [ -z "$PROJECT_SETTINGS" ]; then
              echo "Cannot find settings.gradle or settings.gradle.kts"
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$PROJECT_SETTINGS")" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalRuleVPN-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
