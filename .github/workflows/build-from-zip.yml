
name: Build debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LocalRuleVPN_starter.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check ZIP file
        run: test -f LocalRuleVPN_starter.zip

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q LocalRuleVPN_starter.zip -d android-project
          echo "ZIP contents:"
          ls -la android-project
          find android-project -name settings.gradle -o -name settings.gradle.kts

      - name: Locate Gradle project
        run: |
          if [ -f android-project/settings.gradle ]; then
            echo "PROJECT_DIR=android-project" >> "$GITHUB_ENV"
          elif [ -f android-project/LocalRuleVPN_Android12_starter/settings.gradle ]; then
            echo "PROJECT_DIR=android-project/LocalRuleVPN_Android12_starter" >> "$GITHUB_ENV"
          else
            echo "Cannot find settings.gradle in ZIP"
            find android-project -maxdepth 4 -type f | head -100
            exit 1
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalRuleVPN-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
