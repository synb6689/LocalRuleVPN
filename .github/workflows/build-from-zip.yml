- name: Extract Android project ZIP
  run: |
    test -f LocalRuleVPN_starter.zip
    mkdir -p android-project
    unzip -q LocalRuleVPN_starter.zip -d android-project

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project ZIP
        run: |
          test -f LocalRuleVPN_Android12_starter.zip
          mkdir -p android-project
          unzip -q LocalRuleVPN_Android12_starter.zip -d android-project
          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalRuleVPN-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
