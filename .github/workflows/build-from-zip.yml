name: Build debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'LocalRuleVPN_starter.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check ZIP file
        run: |
          test -f LocalRuleVPN_starter.zip

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q LocalRuleVPN_starter.zip -d android-project
          echo "Extracted project files:"
          find android-project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        run: |
          SETTINGS_FILE=$(find android-project -maxdepth 5 \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Cannot find Gradle settings file."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Cannot find app/build.gradle or app/build.gradle.kts."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"

      - name: Fix JVM target compatibility
        run: |
          cat > "$PROJECT_DIR/jvm-fix.gradle" <<'EOF'
          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }

          tasks.matching {
              it.name == "compileDebugKotlin"
          }.configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon \
            -I jvm-fix.gradle \
            assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalRuleVPN-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
