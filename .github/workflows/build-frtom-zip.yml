name: Build LocalRuleVPN UI update

on:
  workflow_dispatch:
  push:
    paths:
      - 'LocalRuleVPN_repaired_source.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Extract Android project
        run: |
          test -f LocalRuleVPN_repaired_source.zip
          mkdir -p android-project
          unzip -q LocalRuleVPN_repaired_source.zip -d android-project
          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle

      - name: Build EverywhereCore Android AAR
        run: |
          git clone --depth 1 https://github.com/NodePassProject/EverywhereCore-Android.git core-src
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          cd core-src
          bash Scripts/build.sh
          test -f EverywhereCore.aar
          mkdir -p "$GITHUB_WORKSPACE/android-project/app/libs"
          cp EverywhereCore.aar "$GITHUB_WORKSPACE/android-project/app/libs/EverywhereCore.aar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalRuleVPN-ui-update-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
