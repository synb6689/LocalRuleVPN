name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          unzip -o LocalRuleVPN_phone_build.zip -d project
          find project -maxdepth 3 -type f | head -80

      - name: Find Gradle project
        run: |
          find project -name gradlew -type f
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd project
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "找不到 gradlew，请检查 ZIP 内部目录结构"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LocalRuleVPN-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
